name: 🚀 Build EARNOVA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:

      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 📦 npm install
        run: npm install

      - name: 🔨 Build www/ (index.html + sw.js কপি করা)
        run: node scripts/build.js

      # android/ ফোল্ডার না থাকলে বানাবে
      - name: ➕ Add Android platform (প্রথমবার)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # resources/icon.png ও splash.png থেকে সব DPI-র icon/splash বানাবে
      - name: 🎨 Generate native icon & splash screen
        run: npx @capacitor/assets generate --android

      - name: 🔄 Capacitor sync
        run: npx cap sync android

      # ⚠️ নতুন — Google/Facebook Social Login এর জন্য দরকার
      # ১) OAuth callback deep link (শুধু Facebook-এর জন্য — Google নেটিভ
      #    প্লাগিন দিয়ে হয়, কোনো deep link লাগে না)
      # ২) Facebook App ID/Client Token — GitHub Secrets থেকে আসে, যাতে
      #    এই মান রিপোতে প্লেইনটেক্সটে না থাকে
      - name: 🔗 Inject OAuth callback intent-filter + Facebook config
        env:
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, re

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path) as f:
              content = f.read()

          # ── ১) OAuth callback intent-filter (earnova://oauth-callback) ──
          if 'android:host="oauth-callback"' in content:
              print("ℹ️ OAuth callback intent-filter ইতিমধ্যেই আছে, স্কিপ করা হলো")
          else:
              oauth_filter = (
                  '\n        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '            <category android:name="android.intent.category.BROWSABLE" />\n'
                  '            <data android:scheme="earnova" android:host="oauth-callback" />\n'
                  '        </intent-filter>\n'
              )
              m = re.search(r'(<activity[^>]*android:name="\.MainActivity"[^>]*>)(.*?)(</activity>)', content, flags=re.DOTALL)
              if not m:
                  print("⚠️ MainActivity ট্যাগ খুঁজে পাওয়া যায়নি — OAuth callback intent-filter স্কিপ করা হলো।")
              else:
                  content = content[:m.start()] + m.group(1) + m.group(2) + oauth_filter + m.group(3) + content[m.end():]
                  print("✅ OAuth callback intent-filter (earnova://oauth-callback) যোগ করা হলো")

          fb_app_id = os.environ.get('FACEBOOK_APP_ID', '').strip()
          fb_client_token = os.environ.get('FACEBOOK_CLIENT_TOKEN', '').strip()

          # ── ২) Facebook meta-data (শুধু secret দেওয়া থাকলে) ──
          if not fb_app_id or not fb_client_token:
              print("⚠️ FACEBOOK_APP_ID/FACEBOOK_CLIENT_TOKEN secret নেই — Facebook Login স্কিপ করা হলো, build তবু চলবে।")
          elif 'com.facebook.sdk.ApplicationId' in content:
              print("ℹ️ Facebook meta-data ইতিমধ্যেই আছে, স্কিপ করা হলো")
          else:
              fb_meta = (
                  f'<meta-data android:name="com.facebook.sdk.ApplicationId" android:value="fb{fb_app_id}"/>\n'
                  f'        <meta-data android:name="com.facebook.sdk.ClientToken" android:value="{fb_client_token}"/>'
              )
              content = re.sub(r'(<application[^>]*>)', r'\1\n        ' + fb_meta, content, count=1)
              print("✅ Facebook App ID/Client Token AndroidManifest.xml এ যোগ করা হলো")

          with open(manifest_path, 'w') as f:
              f.write(content)
          PYEOF

      - name: 📢 Inject AdMob App ID into AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          import json, re
          with open('capacitor.config.json') as f:
              cfg = json.load(f)
          app_id = cfg.get('plugins', {}).get('AdMob', {}).get('appId', '')
          if not app_id or 'PASTE_YOUR' in app_id:
              print("⚠️ capacitor.config.json এ সঠিক AdMob App ID পাওয়া যায়নি — এই ধাপ স্কিপ করা হলো, অ্যাপ ক্র্যাশ করতে পারে।")
          else:
              path = 'android/app/src/main/AndroidManifest.xml'
              with open(path) as f:
                  content = f.read()
              meta_tag = f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}"/>'
              if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
                  content = re.sub(r'(<application[^>]*>)', r'\1\n        ' + meta_tag, content, count=1)
                  with open(path, 'w') as f:
                      f.write(content)
                  print(f"✅ AdMob App ID ({app_id}) AndroidManifest.xml এ যোগ করা হলো")
              else:
                  print("ℹ️ AdMob App ID meta-data ইতিমধ্যেই আছে, স্কিপ করা হলো")
          PYEOF

      # FCM push এর জন্য: GitHub Secret নাম GOOGLE_SERVICES_JSON
      - name: 🔥 Add google-services.json (FCM config)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "⚠️ GOOGLE_SERVICES_JSON secret নেই — push notification কাজ করবে না, build তবু চলবে।"
          fi

      # FCM-এর জন্য শুধু Google Services প্লাগিন রাখা হলো (Crashlytics সম্পূর্ণ বাদ)
      - name: ⚙️ Enable Google Services plugin
        run: |
          if [ -f "android/app/google-services.json" ]; then
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
            fi
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
          else
            echo "⚠️ google-services.json নেই — Google Services প্লাগিন স্কিপ করা হলো।"
          fi

      - name: 🔑 Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/earnova.keystore

      - name: 🏗️ Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/earnova.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASS }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASS }}

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARNOVA-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 🎉 GitHub Release (tag push হলে)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
