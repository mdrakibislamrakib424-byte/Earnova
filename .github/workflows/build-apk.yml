name: 🚀 Build EARNOVA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# সবচেয়ে কম অনুমতি: এই workflow শুধু কোড পড়তে পারে, repo-তে কিছু লিখতে পারে না
permissions:
  contents: read

# একই branch-এ নতুন push এলে পুরনো বিল্ড বাতিল (সময়/মিনিট বাঁচে)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:

      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 🟢 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # repo-তে ভুল করে গোপন ফাইল (private key, keystore ইত্যাদি) থেকে গেলে সতর্ক করে (বিল্ড থামায় না)
      - name: 🔎 Repo safety check
        run: |
          found=$(git ls-files | grep -Ei '(^|/)(serviceaccount[^/]*\.json|google-services\.json|[^/]*\.(keystore|jks|pem|p12|pfx)|\.env[^/]*)$' || true)
          if [ -n "$found" ]; then
            echo "::warning title=গোপন ফাইল repo-তে আছে::এই ফাইলগুলো repo থেকে মুছুন: $(echo "$found" | tr '\n' ' ')"
          else
            echo "✅ repo-তে কোনো গোপন ফাইল নেই"
          fi

      # package-lock.json মিললে npm ci (ঠিক সেই সংস্করণ), না মিললে npm install + নতুন lock সেভ
      - name: 📦 Install dependencies
        run: |
          if npm ci --no-audit --no-fund; then
            echo "✅ npm ci — lockfile অনুযায়ী ঠিক সংস্করণ বসেছে"
          else
            echo "::warning title=package-lock.json মেলেনি::npm install দিয়ে চালানো হলো। নিচের 'package-lock' artifact নামিয়ে repo-তে কমিট করলে পরের বার npm ci কাজ করবে।"
            npm install --no-audit --no-fund
          fi

      - name: 💾 Save generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 14

      - name: 🔨 Build www/ (minify + vendor libs + secret scan)
        run: node scripts/build.js

      # android/ ফোল্ডার না থাকলে বানাবে
      - name: ➕ Add Android platform (প্রথমবার)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # resources/icon.png ও splash.png থেকে সব DPI-র icon/splash বানাবে
      - name: 🎨 Generate native icon & splash screen
        run: npx @capacitor/assets generate --android

      - name: 🔄 Capacitor sync
        run: npx cap sync android

      - name: 📢 Inject AdMob App ID into AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          import json, re
          with open('capacitor.config.json') as f:
              cfg = json.load(f)
          app_id = cfg.get('plugins', {}).get('AdMob', {}).get('appId', '')
          if not app_id or 'PASTE_YOUR' in app_id:
              print("⚠️ capacitor.config.json এ সঠিক AdMob App ID পাওয়া যায়নি — এই ধাপ স্কিপ করা হলো, অ্যাপ ক্র্যাশ করতে পারে।")
          else:
              path = 'android/app/src/main/AndroidManifest.xml'
              with open(path) as f:
                  content = f.read()
              meta_tag = f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}"/>'
              if 'com.google.android.gms.ads.APPLICATION_ID' not in content:
                  content = re.sub(r'(<application[^>]*>)', r'\1\n        ' + meta_tag, content, count=1)
                  with open(path, 'w') as f:
                      f.write(content)
                  print(f"✅ AdMob App ID ({app_id}) AndroidManifest.xml এ যোগ করা হলো")
              else:
                  print("ℹ️ AdMob App ID meta-data ইতিমধ্যেই আছে, স্কিপ করা হলো")
          PYEOF

      # FCM push এর জন্য: GitHub Secret নাম GOOGLE_SERVICES_JSON
      - name: 🔥 Add google-services.json (FCM config)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "⚠️ GOOGLE_SERVICES_JSON secret নেই — push notification কাজ করবে না, build তবু চলবে।"
          fi

      # FCM-এর জন্য শুধু Google Services প্লাগিন রাখা হলো (Crashlytics সম্পূর্ণ বাদ)
      - name: ⚙️ Enable Google Services plugin
        run: |
          if [ -f "android/app/google-services.json" ]; then
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
            fi
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
          else
            echo "⚠️ google-services.json নেই — Google Services প্লাগিন স্কিপ করা হলো।"
          fi

      # ⚠️ secret গুলো সরাসরি স্ক্রিপ্টের টেক্সটে না বসিয়ে env দিয়ে দেওয়া হয় (নিরাপদ পদ্ধতি)
      - name: 🔑 Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/earnova.keystore
          chmod 600 android/app/earnova.keystore
          if [ ! -s android/app/earnova.keystore ]; then
            echo "::error title=Keystore খালি::KEYSTORE_BASE64 secret ঠিকভাবে বসানো হয়নি"
            exit 1
          fi

      # Firebase/Google Console-এ দেওয়ার জন্য fingerprint (শুধু fingerprint ছাপে, পাসওয়ার্ড নয়)
      - name: 🔍 Print SHA1 / SHA256 fingerprint
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v -keystore android/app/earnova.keystore -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASS | grep -E "Alias name|SHA1:|SHA256:"

      - name: 🏗️ Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/earnova.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      # APK সত্যিই সাইন করা কি না যাচাই + checksum (পরে ফাইল বদলেছে কি না মেলানোর জন্য)
      - name: ✅ Verify signature + checksum
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK"
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AS" ]; then
            "$AS" verify --print-certs "$APK" > /tmp/apk-sig.txt
            grep -E "Signer #1 certificate (DN|SHA-256)" /tmp/apk-sig.txt || true
            echo "✅ APK এর signature বৈধ"
          else
            echo "ℹ️ apksigner পাওয়া যায়নি — signature যাচাই স্কিপ"
          fi

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EARNOVA-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # runner-এ keystore ফাইল যেন কোনোভাবেই থেকে না যায়
      - name: 🧹 Remove keystore
        if: always()
        run: rm -f android/app/earnova.keystore
