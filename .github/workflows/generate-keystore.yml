name: 🔑 Generate Keystore

# ফোনে টার্মিনাল নেই বলে keytool GitHub-এর সার্ভারেই চালানো হচ্ছে।
# এটা ⚠️ একবারই চালাবেন — বারবার চালালে প্রতিবার নতুন keystore তৈরি হবে,
# আর পুরনো keystore দিয়ে সাইন করা APK-এর সাথে নতুনটা মিলবে না
# (Play Store-এ update দিতে সমস্যা হবে)।

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore password (মনে রাখুন, হারালে আর ফিরে পাবেন না)'
        required: true
      key_password:
        description: 'Key password (keystore password এর মতোই দিতে পারেন)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Generate keystore
        run: |
          keytool -genkey -v \
            -keystore earnova.keystore \
            -alias earnova \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=EARNOVA, OU=App, O=EARNOVA, L=Dhaka, S=Dhaka, C=BD"

      - name: 📦 Base64 encode
        run: base64 -w 0 earnova.keystore > keystore_base64.txt

      - name: 📤 Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: earnova-keystore
          path: |
            keystore_base64.txt
            earnova.keystore
          retention-days: 7
